[project]
name = "blendernc"
version = "0.9.1"
description = "Extension to load and manipulate geocubes in blender"
authors = [
    {name = "josuemtzmo",email = "josue.mtzmo@gmail.com"}
]
homepage = "https://github.com/blendernc/blendernc"
repository = "https://github.com/blendernc/blendernc"
readme = "README.md"
include = ["LICENSE"]
license = "MIT"
requires-python = ">=3.13"
packages = [
    { include = "blendernc", from = "." },
]
dependencies = [
     "xarray (>=2026.7.0,<2027.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "zarr (>=3.3.0,<4.0.0)",
    "ecmwflibs (>=0.7.0,<0.8.0)",
    "cfgrib (>=0.9.15.1,<0.10.0.0)",
    "cmocean (>=4.0.3,<5.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "dask (>=2026.8.0,<2027.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "netcdf4 (>=1.7.4,<2.0.0)",
    "toolz (>=1.1.0,<2.0.0)",
    "pooch (>=1.9.0,<2.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "toml (>=0.10.2,<0.11.0)"
]

[tool.poetry.urls]
"Changelog" = "https://github.com/blendernc/blendernc/blob/master/CHANGELOG.md"

[tool.semantic_release]
# bl_info["version"] in blendernc/__init__.py is a tuple, which semantic-release
# cannot write; .github/workflows/release.yml updates it before the release.
version_variables = [
    "blendernc/__init__.py:__version__",
    "docs/source/conf.py:release",
    ".github/ISSUE_TEMPLATE.md:BlenderNC Version",
]
version_toml = [
    "pyproject.toml:project.version",
    "blender_manifest.toml:version",
]
tag_format = "v{version}"
commit_message = "{version}"
commit_author = "github-actions <action@github.com>"
allow_zero_version = true
major_on_zero = false
build_command = "pip install poetry && poetry build"

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!--next-version-placeholder-->"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.docs.dependencies]
myst-parser = ">=2.0"
sphinx = ">=7.1.2"
sphinx-design = ">=0.5.0"
sphinx-rtd-theme = ">=1.3.0"

[tool.esbonio.sphinx]
pythonCommand = "/Users/josnez/.local/share/mamba/envs/poetry/bin/python"