name: Test

on: [push, pull_request]

jobs:
  pre_job:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/README.md", "**/docs/**"]'
          do_not_skip: '["pull_request", "schedule"]'

  test:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender: ['5.2.0', '5.3.0']
    steps:
      - uses: actions/checkout@v4
      - name: Pull Blender Docker Image
        run: |
          docker pull ghcr.io/ranchcomputing/blender-cpu-image:${{ matrix.blender }}

      - name: Test addon
        run: |
          docker run -w /blendernc --rm --mount type=bind,source="$(pwd)",target=/blendernc -t ghcr.io/ranchcomputing/blender-cpu-image:${{ matrix.blender }} /bin/sh -c "bash ./tests/build-test.sh"

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage_${{ matrix.blender }}
          path: ./tests/.coverage_*
          # The coverage data files are dotfiles, which v4 skips by default.
          include-hidden-files: true
          if-no-files-found: error


  coverage:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender: ['5.2.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          # Each artifact lands in ./tests/coverage_<blender>/ like it did with v2.
          pattern: coverage_*
          path: ./tests/

      - name: Coverage combine and report
        run: |
          docker run -w /blendernc --rm --mount type=bind,source="$(pwd)",target=/blendernc -t ghcr.io/ranchcomputing/blender-cpu-image:${{ matrix.blender }} /bin/sh -c "bash ./tests/coverage-combine.sh"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tests/coverage.xml
          flags: unittests

