name: Build BlenderNC using Poetry

on:
  push:
    branches:
      - master

jobs:
  build-n-publish:
    name: Build BlenderNC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          --user
      - name: Upgrade pip
        run: >-
          python -m
          pip install
          --upgrade pip
      - name: Install poetry
        run: >-
          python -m
          pip install poetry
      - name: Install BlenderNC using poetry
        run: |
          poetry build
          poetry install