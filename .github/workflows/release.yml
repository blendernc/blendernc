name: Semantic Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry "python-semantic-release==10.7.0"
          poetry config virtualenvs.create false
          poetry install

      # semantic-release cannot write the bl_info["version"] tuple nor the versioned
      # zip names and download links in the install docs, so write them here. Both
      # edits go into its release commit: __init__.py is one of its version_variables
      # and install.rst is listed in its assets.
      - name: Update bl_info version and install links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(semantic-release version --print-last-released)
          next=$(semantic-release version --print)
          echo "last released: $last, next: $next"
          if [ "$last" = "$next" ]; then
            echo "No release will be made"
            exit 0
          fi
          python - "$next" <<'EOF'
          import re, sys

          version = sys.argv[1]
          major, minor, patch = version.split(".")[:3]

          def substitute(path, pattern, repl, count=None):
              """Rewrite pattern in path; fail if it no longer matches as expected."""
              src = open(path).read()
              new, n = re.subn(pattern, repl, src)
              if n == 0 or (count is not None and n != count):
                  sys.exit(f"{path}: expected {count or 'some'} {pattern!r}, found {n}")
              open(path, "w").write(new)

          substitute("blendernc/__init__.py", r'("version": )\(\d+, \d+, \d+\)',
                     rf"\g<1>({major}, {minor}, {patch})", count=1)
          # Zip names (link text, link targets and URLs) and the tag in the URLs.
          install = "docs/source/install.rst"
          substitute(install, r"blendernc-\d+\.\d+\.\d+-", f"blendernc-{version}-")
          substitute(install, r"/download/v\d+\.\d+\.\d+/", f"/download/v{version}/")
          EOF
          git diff --stat

      - name: Release new version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version

      - name: Upload build to the GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish --tag "${{ steps.release.outputs.tag }}"
