name: Semantic Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry "python-semantic-release==10.7.0"
          poetry config virtualenvs.create false
          poetry install

      # semantic-release cannot write the bl_info["version"] tuple, so write it here.
      # The file is one of its version_variables, so the edit goes into its release commit.
      - name: Update bl_info version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(semantic-release version --print-last-released)
          next=$(semantic-release version --print)
          echo "last released: $last, next: $next"
          if [ "$last" = "$next" ]; then
            echo "No release will be made"
            exit 0
          fi
          python - "$next" <<'EOF'
          import re, sys
          major, minor, patch = sys.argv[1].split(".")[:3]
          path = "blendernc/__init__.py"
          src = open(path).read()
          new, n = re.subn(r'("version": )\(\d+, \d+, \d+\)',
                           rf"\g<1>({major}, {minor}, {patch})", src)
          if n != 1:
              sys.exit(f"Expected one bl_info version tuple in {path}, found {n}")
          open(path, "w").write(new)
          EOF
          git diff --stat

      - name: Release new version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version

      - name: Upload build to the GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish --tag "${{ steps.release.outputs.tag }}"
